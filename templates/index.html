<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Similarity Face Detector</title>
  <link rel="stylesheet" href="/static/css/style.css"/>
</head>
<body>

  <div class="bg"></div>

  <main class="container">

    <header class="hero">
      <h1>Similar Face Detector</h1>
    </header>

    <section class="grid">

      <!-- Face DB Control -->
      <div class="card glass">
        <h2>Face DB Control</h2>
        <p class="muted">Add images to <b>face_db/</b> then click rebuild.</p>
        <button id="rebuildBtn" class="btn primary">Rebuild Database</button>
        <p id="rebuildStatus" class="status"></p>
      </div>

      <!-- Upload & Match -->
      <div class="card glass">
        <h2>Upload & Match</h2>

        <div class="uploadRow">
          <!-- Hidden file input -->
          <input type="file" id="imageInput" accept="image/*" hidden/>

          <!-- Custom choose button -->
          <button class="btn primary" id="chooseBtn">📁 Choose Image</button>

          <!-- Search button -->
          <button id="searchBtn" class="btn glow">🔎 Search</button>
        </div>

        <p id="fileName" class="muted" style="margin-top:10px;"></p>

        <p id="searchStatus" class="status"></p>

        <div id="loader" class="loader hidden">
          <span class="dot"></span><span class="dot"></span><span class="dot"></span>
          <p>Ultra scanning...</p>
        </div>

        <div id="previewWrap" class="preview hidden">
          <h3>Uploaded</h3>
          <img id="uploadedPreview" src="" alt="uploaded"/>
        </div>

        <div id="results" class="results"></div>
      </div>

    </section>

    <footer class="footer"></footer>

  </main>

  <script src="/static/js/app.js"></script>
  <script>
    // Link choose button to hidden input
    const chooseBtn = document.getElementById("chooseBtn");
    const imageInput = document.getElementById("imageInput");
    const fileName = document.getElementById("fileName");

    chooseBtn.addEventListener("click", () => {
      imageInput.click(); // Trigger hidden file input
    });

    imageInput.addEventListener("change", () => {
      if (imageInput.files.length > 0) {
        fileName.innerText = `Selected file: ${imageInput.files[0].name}`;
      } else {
        fileName.innerText = "";
      }
    });
  </script>
</body>
</html>
